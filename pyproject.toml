[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[project]
name = "atlas"
version = "1.0.1"
description = "atlasデータにpythonで簡単にアクセスするためのライブラリです。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Your Name", email = "your@email.com" }
]
dependencies = [
  "chromadb",
  "openai>=0.8.0",
  "platformdirs>=4.3.7",
  "polars",
  "pydantic-settings>=2.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2",
  "ruff",
  "ty",
]

[project.urls]
Homepage = "https://github.com/Fuji-no-yama/atlas-python-sdk"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "S", "PTH", "RET", "ASYNC", "T201", "RUF", "ERA001"]
# D: ドックストリング関連
# S: 安全規則関連(picklなど)
# PTH: pathlib推奨
# RET: 戻り値の最適化
# ASYNC: 非同期関連
# T201: printの制限
# RUF: カタカナの「ノ」の制約など

# 自動修正から除外したいルールを指定
unfixable = ["F401", "E501"] # 例: 未使用importや行長制限など

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PT018", "INP001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require external API keys (OpenAI)",
]
